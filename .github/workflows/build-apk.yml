name: Build ScanTrad Clean APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Pick newest clean source
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name 'ScanTrad_Clean_*.zip' | sort -V | tail -n 1)
          test -n "$ZIP" || (echo "No ScanTrad_Clean_*.zip found" && exit 1)
          echo "SOURCE_ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "Using $ZIP"

      - name: Extract source
        run: unzip -q "$SOURCE_ZIP" -d source

      - name: Build APK
        working-directory: source/ScanTradClean
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp source/ScanTradClean/app/build/outputs/apk/debug/app-debug.apk ScanTrad-Clean.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScanTrad-Clean-APK
          path: ScanTrad-Clean.apk
          if-no-files-found: error
          retention-days: 30
